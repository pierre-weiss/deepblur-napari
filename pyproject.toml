[project]
name = "deepblur_napari"
dynamic = ["version"]
description = "Blind deblurring and PSF metrology with neural networks, for microscopy"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Pierre Weiss", email = "pierre.weiss@cnrs.fr" },
    { name = "Florian Sarron", email = "florian.sarron@irit.fr" },
    { name = "Minh-Hai NGUYEN", email = "nguyenhai7120qh@gmail.com" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: napari",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "magicgui",
    # No Qt binding: napari brings it (see the "all" extra)
    "napari>=0.6",
    "qtpy",
    "deepinv>=0.5.0",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "pyyaml",
    "imageio",
    "huggingface_hub",  # fallback source of the identification weights
]

## -------------------------------------------------------------------------------

[project.optional-dependencies]
# napari with its Qt backend, for a new environment
all = ["napari[all]"]
testing = [
    "tox",
    "pytest",     # https://docs.pytest.org/en/latest/contents.html
    "pytest-cov", # https://pytest-cov.readthedocs.io/en/latest/
    "pytest-qt",  # https://pytest-qt.readthedocs.io/en/latest/
    "napari[all]",
]

[project.urls]
"Source Code" = "https://github.com/pierre-weiss/deepblur-napari"
"Bug Tracker" = "https://github.com/pierre-weiss/deepblur-napari/issues"

[project.entry-points."napari.manifest"]
deepblur_napari = "deepblur_napari:napari.yaml"

[build-system]
requires = ["setuptools>=77.0.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["deepblur_napari.old*"]  # local archive of the former code

[tool.setuptools.package-data]
"*" = ["*.yaml", "images/*", "images/**/*"]

[tool.setuptools_scm]
write_to = "src/deepblur_napari/_version.py"
fallback_version = "0.0.1+nogit"

[tool.black]
line-length = 79
target-version = ['py310', 'py311', 'py312', 'py313']

[tool.ruff]
line-length = 79
lint.select = [
    "E",
    "F",
    "W",   #flake8
    "UP",  # pyupgrade
    "BLE", # flake8-blind-exception
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "G",   # flake8-logging-format
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
lint.ignore = [
    "E501",   # line too long. let black handle this
    "UP006",
    "UP007",  # type annotation. As using magicgui require runtime type annotation then we disable this.
    "SIM117", # flake8-simplify - some of merged with statements are not looking great with black, reanble after drop python 3.9
]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*vendored*",
    "*_vendor*",
]

target-version = "py310"
fix = true
